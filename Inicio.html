<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <title>Dex - Inicio</title>

    <link rel="stylesheet" href="inicio.css">
    <link rel="stylesheet" href="dex-menu.css">
    <link rel="stylesheet" href="transition.css">

</head>


<body>


    <!-- ENCABEZADO -->

    <header class="top-bar">

        <button
            id="dexMenuButton"
            class="logo-button"
            type="button"
            aria-label="Abrir menú de Dex"
        >
            <img
                src="assets/dex-logo.png"
                alt="Dex"
            >

            <span class="logo-arrow">⌄</span>

        </button>

    </header>



    <!-- CONTENIDO PRINCIPAL -->

    <main class="main-content">


        <section class="welcome">

            <h1>
                Bienvenido a Dex
            </h1>

            <p>
                Explora y descubre todo lo que necesitas.
            </p>

        </section>



        <!-- MENÚ PRINCIPAL -->

        <section class="menu-grid">


            <!-- CARTAS -->

            <button
                class="menu-card"
                data-section="cartas"
                type="button"
            >

                <div class="card-icon">
                    🃏
                </div>

                <div class="card-content">

                    <h2>
                        Cartas
                    </h2>

                    <p>
                        Busca, consulta y descubre
                        cartas.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- ELEMENTOS -->

            <button
                class="menu-card"
                data-section="elementos"
                type="button"
            >

                <div class="card-icon">
                    ⚡
                </div>

                <div class="card-content">

                    <h2>
                        Elementos
                    </h2>

                    <p>
                        Conoce los elementos,
                        fortalezas y debilidades.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- HABILIDADES -->

            <button
                class="menu-card"
                data-section="habilidades"
                type="button"
            >

                <div class="card-icon">
                    ✨
                </div>

                <div class="card-content">

                    <h2>
                        Habilidades
                    </h2>

                    <p>
                        Explora habilidades,
                        efectos y características.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- RAIDS -->

            <button
                class="menu-card"
                data-section="raids"
                type="button"
            >

                <div class="card-icon">
                    ⚔️
                </div>

                <div class="card-content">

                    <h2>
                        Raids
                    </h2>

                    <p>
                        Consulta habilidades y
                        características de las Raids.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- TEAM -->

            <button
                class="menu-card"
                data-section="team"
                type="button"
            >

                <div class="card-icon">
                    👥
                </div>

                <div class="card-content">

                    <h2>
                        Team
                    </h2>

                    <p>
                        Crea y organiza tus equipos.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- EVOLVE -->

            <button
                class="menu-card"
                data-section="evolve"
                type="button"
            >

                <div class="card-icon">
                    🔄
                </div>

                <div class="card-content">

                    <h2>
                        Evolve
                    </h2>

                    <p>
                        Consulta evoluciones y
                        requisitos.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>



            <!-- AYUDA -->

            <button
                class="menu-card"
                data-section="ayuda"
                type="button"
            >

                <div class="card-icon">
                    📖
                </div>

                <div class="card-content">

                    <h2>
                        Ayuda
                    </h2>

                    <p>
                        Aprende a utilizar Dex.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


        </section>


    </main>



    <script src="inicio.js"></script>
    <script src="dex-menu.js"></script>
    <script src="transition.js"></script>

</body>

</html>
